<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Define gradient for bulb glow effect -->
  <defs>
    <radialGradient id="bulbGradient" cx="50%" cy="40%" r="50%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </radialGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3C72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2A5298;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGradient)" rx="40"/>

  <!-- Bulb glow effect -->
  <circle cx="100" cy="85" r="50" fill="url(#bulbGradient)" opacity="0.3"/>

  <!-- Main bulb glass -->
  <circle cx="100" cy="85" r="45" fill="url(#bulbGradient)" stroke="#FFD700" stroke-width="2"/>

  <!-- Bulb highlight (shine) -->
  <ellipse cx="80" cy="65" rx="15" ry="20" fill="#FFFFFF" opacity="0.4"/>

  <!-- Bulb base threads (screw part) -->
  <rect x="85" y="125" width="30" height="15" rx="2" fill="#C0C0C0" stroke="#999999" stroke-width="1"/>
  <line x1="85" y1="133" x2="115" y2="133" stroke="#999999" stroke-width="1"/>

  <!-- Socket base -->
  <ellipse cx="100" cy="140" rx="20" ry="8" fill="#A9A9A9" stroke="#696969" stroke-width="1"/>
  <ellipse cx="100" cy="142" rx="18" ry="6" fill="#C0C0C0"/>

  <!-- Light rays (glow effect) -->
  <g stroke="#FFD700" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <line x1="100" y1="20" x2="100" y2="35"/>
    <line x1="145" y1="30" x2="155" y2="40"/>
    <line x1="165" y1="75" x2="150" y2="75"/>
    <line x1="155" y1="120" x2="145" y2="130"/>
    <line x1="55" y1="30" x2="45" y2="40"/>
    <line x1="35" y1="75" x2="50" y2="75"/>
    <line x1="45" y1="120" x2="55" y2="130"/>
  </g>

  <!-- Corner decoration circles -->
  <circle cx="20" cy="20" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="180" cy="20" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="20" cy="180" r="3" fill="#FFD700" opacity="0.6"/>
  <circle cx="180" cy="180" r="3" fill="#FFD700" opacity="0.6"/>
</svg>
